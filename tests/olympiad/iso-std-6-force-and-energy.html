<script>
const Q=[["A force is best defined as a:", ["Push or pull", "Form of energy", "Type of material", "Measure of temperature"], 0, "A force is a push or pull that can maintain or alter motion, or change an object's shape."], ["Which action applies muscular force?", ["A magnet attracting a screw", "Kicking a football", "An apple falling", "A comb attracting paper bits"], 1, "Muscular force is exerted by the muscles of our body."], ["The force exerted by the muscles of our body is called:", ["Magnetic force", "Muscular force", "Gravitational force", "Elastic force"], 1, "Muscular force is produced by our muscles."], ["A ball rolling on the ground eventually stops mainly because of:", ["Solar force", "Frictional force", "Magnetic force", "Buoyant force"], 1, "Friction opposes motion and slows moving objects."], ["Friction acts in a direction:", ["Same as motion", "Opposite to motion", "Vertically upward always", "Towards the centre of Earth"], 1, "Friction acts opposite to the direction of motion or attempted motion."], ["Which surface usually offers greater friction?", ["Smooth glass", "Polished marble", "Rough surface", "Oiled surface"], 2, "A rough surface offers greater friction than a smooth surface."], ["Which is an advantage of friction?", ["It wears out tyres", "It makes heavy objects difficult to move", "It helps us walk", "It wears out shoe soles"], 2, "Friction between our feet and the ground helps us walk."], ["Which is a disadvantage of friction?", ["It helps us write", "It allows us to grip objects", "It causes machine parts to wear out", "It helps vehicles stop with brakes"], 2, "Friction causes the soles of shoes and moving machine parts to wear out."], ["A magnet attracting an iron screw is an example of:", ["Frictional force", "Magnetic force", "Muscular force", "Buoyant force"], 1, "The force exerted by a magnet is magnetic force."], ["Which pair of magnetic poles attract each other?", ["North and North", "South and South", "North and South", "Similar poles"], 2, "Opposite magnetic poles attract; similar poles repel."], ["The force by which Earth pulls objects towards itself is:", ["Electrostatic force", "Elastic force", "Gravitational force", "Magnetic force"], 2, "Earth's gravitational force pulls objects towards its centre."], ["An apple falling from a tree is due to:", ["Friction", "Gravity", "Magnetism", "Elasticity"], 1, "Earth's gravity pulls the apple downwards."], ["A stretched rubber band returns to its original shape due to:", ["Buoyant force", "Elastic force", "Mechanical force", "Electrostatic force"], 1, "Elastic force acts when a body is deformed and helps it regain its shape."], ["The upward push exerted by water on an object is called:", ["Gravitational force", "Buoyant force", "Frictional force", "Muscular force"], 1, "Buoyant force is the upward push exerted by a fluid on an object."], ["A plastic comb rubbed against dry hair attracts tiny pieces of paper due to:", ["Electrostatic force", "Gravitational force", "Friction only", "Buoyant force"], 0, "Rubbing can charge the comb, allowing it to exert electrostatic force."], ["Which of the following is a non-contact force?", ["Muscular force", "Frictional force", "Magnetic force", "Mechanical force"], 2, "Magnetic force can act from a distance without physical contact."], ["Energy is the ability to:", ["Do work", "Occupy space", "Attract magnets", "Produce friction only"], 0, "Energy is defined as the ability to do work."], ["Mechanical energy is possessed by an object due to its:", ["Colour and shape", "Motion or position", "Temperature only", "Sound only"], 1, "Mechanical energy is due to motion or position."], ["Kinetic energy is the energy possessed by an object due to its:", ["Position", "Motion", "Colour", "Temperature"], 1, "Kinetic energy is energy due to motion."], ["Potential energy of an object increases when its:", ["Height above the ground increases", "Colour changes", "Speed becomes zero only", "Temperature decreases"], 0, "The higher an object is from the ground, the more gravitational potential energy it possesses."], ["A running car possesses mainly:", ["Kinetic energy", "Sound energy only", "Potential energy only", "Solar energy"], 0, "A moving car has kinetic energy because it is in motion."], ["Heat energy is responsible for the sensation of:", ["Hotness or coldness", "Brightness", "Sound", "Magnetism"], 0, "Heat energy is associated with the sensation of hotness or coldness."], ["Which is described as a readily available, non-polluting source of energy in the lesson?", ["Coal", "Solar energy", "Petrol", "Diesel"], 1, "Solar energy is a readily available and non-polluting source."], ["Plants use which form of energy for photosynthesis?", ["Sound energy", "Solar energy", "Mechanical energy", "Geothermal energy"], 1, "Plants use energy from the Sun during photosynthesis."], ["Solar panels convert solar energy into:", ["Sound energy", "Electrical energy", "Magnetic force", "Friction"], 1, "Solar panels use sunlight to produce electricity."], ["Light energy enables us to:", ["Hear sounds", "See things", "Feel friction", "Lift heavy loads"], 1, "Light makes objects visible to us."], ["Electrical energy is associated with the movement of:", ["Water molecules", "Electrical charges", "Sound waves", "Rocks"], 1, "Electrical energy is the energy of moving electrical charges."], ["Sound is produced when an object:", ["Vibrates", "Freezes", "Dissolves", "Becomes transparent"], 0, "Sound energy is produced by vibrations."], ["Sound energy can travel through:", ["Only vacuum", "Solids, liquids and gases", "Only empty space", "No material medium"], 1, "Sound travels through solids, liquids and gases, but not through vacuum."], ["The energy obtained from moving water is called:", ["Wind energy", "Hydro energy", "Geothermal energy", "Solar energy"], 1, "Hydro energy is obtained from moving water."], ["Wind turbines convert wind energy into useful energy such as:", ["Electricity", "Petrol", "Coal", "Food"], 0, "Wind turbines can convert wind energy into electrical energy."], ["Geothermal energy comes from:", ["The Sun", "Heat within the Earth", "Moving air", "Ocean waves"], 1, "Geothermal energy is heat from inside the Earth."], ["According to the law of conservation of energy, energy:", ["Can be created freely", "Can be destroyed", "Can neither be created nor destroyed, only converted", "Always disappears"], 2, "Energy changes from one form to another but is not created or destroyed."], ["A simple machine helps us to do work:", ["More easily", "Without any force", "Without energy", "Only by increasing weight"], 0, "Simple machines make work easier, for example by changing force direction or reducing effort."], ["A lever is a rigid rod that turns about a fixed point called the:", ["Load", "Effort", "Fulcrum", "Groove"], 2, "The fixed pivot point of a lever is called the fulcrum."], ["In a first-class lever, the _____ lies between the effort and the load.", ["Fulcrum", "Wheel", "Pulley", "Wedge"], 0, "In a first-class lever, the fulcrum is between effort and load."], ["Which is an example of a first-class lever?", ["Nutcracker", "Wheelbarrow", "Scissors", "Tweezers"], 2, "Scissors are a first-class lever because the pivot lies between effort and load."], ["In a second-class lever, the _____ lies between the fulcrum and effort.", ["Effort", "Load", "Axle", "Wedge"], 1, "In a second-class lever, the load is between the fulcrum and effort."], ["Which is an example of a second-class lever?", ["Tweezers", "Wheelbarrow", "Scissors", "Fishing rod"], 1, "A wheelbarrow is a second-class lever."], ["In a third-class lever, the _____ lies between the fulcrum and load.", ["Load", "Effort", "Axle", "Pulley"], 1, "In a third-class lever, the effort is between fulcrum and load."], ["Which is an example of a third-class lever?", ["Crowbar", "Nutcracker", "Tweezers", "Wheelbarrow"], 2, "Tweezers are an example of a third-class lever."], ["A pulley is a small wheel with a groove around its:", ["Centre", "Outer edge", "Axle only", "Handle"], 1, "A pulley has a groove around its outer edge to hold a rope."], ["A fixed pulley mainly helps by:", ["Changing the direction of force", "Reducing the load to half", "Removing gravity", "Increasing the weight"], 0, "A fixed pulley changes the direction of effort but does not reduce the effort needed."], ["In an ideal movable pulley described in the lesson, the effort needed to lift a load is reduced by:", ["One-fourth", "One-half", "Three times", "Not at all"], 1, "The movable pulley reduces the effort needed to lift the load by half."], ["A sloping surface connecting a lower level to a higher level is called:", ["Wedge", "Inclined plane", "Screw", "Pulley"], 1, "An inclined plane helps move heavy objects to a height."], ["Which is an example of an inclined plane?", ["Ramp", "Scissors", "Screwdriver", "Nutcracker"], 0, "A ramp is an inclined plane."], ["A wheel and axle consists of:", ["Two equal rods", "A large wheel connected to a smaller rod (axle)", "Two inclined planes", "A grooved wheel and rope"], 1, "A wheel and axle has a large wheel connected to a small rod called an axle."], ["Which is an example of a wheel-and-axle arrangement?", ["Axe", "Screw", "Steering wheel", "Razor"], 2, "A steering wheel is an example of a wheel-and-axle arrangement."], ["A screw is a simple machine formed when an inclined plane wraps around a:", ["Flat plate", "Straight rod-like structure", "Pulley", "Wheel"], 1, "A screw is a modification of an inclined plane wrapped around a rod."], ["Which of these is an example of a wedge?", ["Steering wheel", "Axe", "Pulley", "Ramp"], 1, "An axe has a sharp edge and is an example of a wedge."]];let n=0,A=Array(Q.length).fill(null),L=Array(Q.length).fill(false);
const quizRoot=document.getElementById('quiz'),statusText=document.getElementById('status'),progressBar=document.getElementById('bar'),timerText=document.getElementById('timer'),resultPanel=document.getElementById('result');
let selectedAnswers=Array(Q.length).fill(null),remainingSeconds=45*60,timerInterval=null,finished=false;
function startTest(){if(timerInterval!==null)return;renderQuestions();updateProgress();timerInterval=window.setInterval(updateTimer,1000)}
function renderQuestions(){quizRoot.replaceChildren();Q.forEach((question,index)=>{const card=document.createElement('section');card.className='q';const heading=document.createElement('div');heading.className='qhead';const number=document.createElement('span');number.className='num';number.textContent=index+1;const title=document.createElement('h2');title.textContent=question[0];heading.append(number,title);card.append(heading);const options=document.createElement('div');options.className='opts';question[1].forEach((option,optionIndex)=>{const button=document.createElement('button');button.type='button';button.className='opt';button.textContent=`${'ABCD'[optionIndex]}. ${option}`;button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>selectAnswer(index,optionIndex));options.append(button)});card.append(options);const explanation=document.createElement('div');explanation.className='explanation';card.append(explanation);quizRoot.append(card)})}
function selectAnswer(questionIndex,optionIndex){if(finished)return;selectedAnswers[questionIndex]=optionIndex;const buttons=quizRoot.children[questionIndex].querySelectorAll('.opt');buttons.forEach((button,index)=>{button.classList.toggle('selected',index===optionIndex);button.setAttribute('aria-pressed',String(index===optionIndex))});updateProgress()}
function updateProgress(){const answered=selectedAnswers.filter(answer=>answer!==null).length;statusText.textContent=`${answered} of ${Q.length} answered`;progressBar.style.width=`${answered/Q.length*100}%`}
function updateTimer(){remainingSeconds=Math.max(0,remainingSeconds-1);timerText.textContent=`${Math.floor(remainingSeconds/60)}:${String(remainingSeconds%60).padStart(2,'0')}`;if(remainingSeconds===0)submitTest(true)}
function submitTest(timeExpired=false){if(finished)return;finished=true;window.clearInterval(timerInterval);let correct=0,wrong=0,unanswered=0;Q.forEach((question,index)=>{const buttons=quizRoot.children[index].querySelectorAll('.opt'),answer=selectedAnswers[index];buttons.forEach((button,optionIndex)=>{button.disabled=true;if(optionIndex===question[2])button.classList.add('correct');if(answer===optionIndex&&answer!==question[2])button.classList.add('wrong')});if(answer===null)unanswered++;else if(answer===question[2])correct++;else wrong++;const explanation=quizRoot.children[index].querySelector('.explanation');explanation.textContent=question[3];explanation.classList.add('show')});document.getElementById('score').textContent=`${correct} / ${Q.length}`;document.getElementById('remark').textContent=correct>=45?'Excellent work!':correct>=35?'Very good effort!':correct>=25?'Good attempt — review the highlighted answers.':'Keep practising — review the highlighted answers and try again.';document.getElementById('summary').textContent=`Correct: ${correct} · Incorrect: ${wrong} · Unanswered: ${unanswered}${timeExpired?' · Time is up.':''}`;resultPanel.classList.add('show');document.getElementById('finish').disabled=true;resultPanel.scrollIntoView({behavior:'smooth'})}
document.getElementById('finish').addEventListener('click',()=>submitTest());document.getElementById('reset').addEventListener('click',()=>window.location.reload());document.getElementById('retake').addEventListener('click',()=>window.location.reload());startTest();
</script></body></html>
