<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earth and Universe | 50 MCQ Test</title><style>
:root{--ink:#172033;--muted:#64748b;--line:#e2e8f0;--blue:#2457c5;--bg:#f4f7fb;--good:#087443;--bad:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 50px}.hero{background:linear-gradient(135deg,#172554,#2563eb);color:white;padding:26px;border-radius:20px;margin-bottom:18px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;opacity:.8;font-weight:700}.hero h1{margin:6px 0;font-size:clamp(1.7rem,5vw,2.5rem)}.hero p{margin:4px 0 0;opacity:.9}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.pill{background:#ffffff20;border:1px solid #ffffff40;padding:6px 11px;border-radius:99px;font-size:.85rem}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0}.progress{height:8px;background:#dbe4f0;border-radius:99px;overflow:hidden;flex:1;min-width:120px}.progress span{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}.stats{font-size:.9rem;color:var(--muted)}.q{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;margin:13px 0;box-shadow:0 2px 8px #0f172a08}.qhead{display:flex;gap:10px;align-items:flex-start}.num{flex:none;background:#eaf0ff;color:#1d4ed8;border-radius:9px;padding:3px 9px;font-weight:800}.q h3{font-size:1.02rem;margin:2px 0 14px;font-weight:650}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:white;color:var(--ink);font:inherit;cursor:pointer;transition:.15s}.opt:hover{border-color:#8aa8ef;background:#f8faff}.opt:disabled{cursor:default;opacity:1}.opt.correct{border-color:#16a36a;background:#ecfdf3;color:#065f46}.opt.wrong{border-color:#e05a52;background:#fff1f0;color:#9f1d18}.feedback{display:none;margin-top:11px;padding:10px 12px;border-radius:10px;background:#f1f5f9;color:#334155;font-size:.92rem}.feedback.show{display:block}.feedback.good{background:#ecfdf3;color:#065f46}.feedback.bad{background:#fff1f0;color:#9f1d18}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:11px;padding:11px 17px;font:600  .95rem system-ui;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e8edf5;color:#243047}.result{display:none;background:white;border:1px solid var(--line);border-radius:16px;padding:22px;margin:20px 0}.result.show{display:block}.score{font-size:2.4rem;font-weight:850;color:var(--blue)}.small{color:var(--muted);font-size:.9rem}.footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:28px}@media(max-width:620px){.opts{grid-template-columns:1fr}.q{padding:15px}.hero{padding:21px}}
</style></head><body><main class="wrap"><header class="hero"><div class="eyebrow">Class 5 · Science · Chapter 6</div><h1>Earth and Universe</h1><p>50 multiple-choice questions · Based on the lesson pages provided</p><div class="meta"><span class="pill">6.1 The Solar System</span><span class="pill">6.2 Earth and its movements</span><span class="pill">6.3 Moon and its phases</span><span class="pill">6.4–6.6</span></div></header><div class="toolbar"><div class="stats" id="status">0 of 50 answered</div><div class="progress"><span id="bar"></span></div><div class="stats" id="liveScore">Score: 0</div></div><div id="quiz"></div><div class="actions"><button class="btn primary" id="finish">Finish test & view score</button><button class="btn secondary" id="reset">Reset test</button></div><section class="result" id="result"><div class="eyebrow" style="color:#64748b">Your result</div><div class="score" id="score"></div><h2 id="remark"></h2><p id="summary" class="small"></p><button class="btn secondary" id="review">Review incorrect / unanswered</button></section><div class="footer">Math Ma’am Academy · Where Every Subject Clicks.</div></main><script>
const data = [["The Sun is a star present in which galaxy?", ["Andromeda Galaxy", "Milky Way Galaxy", "Whirlpool Galaxy", "Sombrero Galaxy"], 1, "The Sun is one of the billions of stars in the Milky Way Galaxy."], ["What are the Sun, Moon, planets and stars collectively called?", ["Terrestrial objects", "Celestial bodies", "Artificial bodies", "Atmospheric bodies"], 1, "Natural bodies found in space are called celestial bodies."], ["What is the correct order of the eight planets from the Sun?", ["Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus, Neptune", "Venus, Mercury, Earth, Mars, Saturn, Jupiter, Neptune, Uranus", "Mercury, Earth, Venus, Mars, Jupiter, Uranus, Saturn, Neptune", "Mercury, Venus, Mars, Earth, Jupiter, Saturn, Neptune, Uranus"], 0, "The order is Mercury, Venus, Earth, Mars, Jupiter, Saturn, Uranus and Neptune."], ["Which planet is the smallest and closest to the Sun?", ["Venus", "Mars", "Mercury", "Earth"], 2, "Mercury is the smallest planet and the closest planet to the Sun."], ["Which is the hottest planet in our solar system?", ["Mercury", "Venus", "Mars", "Jupiter"], 1, "Venus is the hottest planet because its thick atmosphere traps heat."], ["Which planet is known as the Blue Planet?", ["Neptune", "Earth", "Uranus", "Venus"], 1, "About 70 percent of Earth's surface is covered with water."], ["Which planet is called the Red Planet?", ["Jupiter", "Mars", "Mercury", "Saturn"], 1, "Rust-coloured iron dust makes Mars appear red."], ["Which is the largest planet in the solar system?", ["Saturn", "Earth", "Jupiter", "Neptune"], 2, "Jupiter is the largest planet."], ["Which planet is famous for its prominent rings of ice and rock?", ["Mars", "Saturn", "Venus", "Mercury"], 1, "Saturn has prominent rings made mainly of ice and rocky material."], ["Which pair of planets rotates from east to west?", ["Earth and Mars", "Jupiter and Saturn", "Venus and Uranus", "Mercury and Neptune"], 2, "Venus and Uranus rotate in the opposite direction to most planets."], ["Which planet has no natural satellite according to the lesson?", ["Earth", "Mars", "Mercury", "Neptune"], 2, "Mercury has no natural satellite."], ["What is Pluto classified as since 2006?", ["A major planet", "A dwarf planet", "A natural satellite", "An asteroid"], 1, "In 2006, Pluto was classified as a dwarf planet."], ["What is the main source of energy for our solar system?", ["Moon", "Jupiter", "Sun", "Earth"], 2, "The Sun provides energy in the form of light and heat."], ["Which process produces energy inside the Sun?", ["Combustion", "Nuclear fusion", "Evaporation", "Nuclear fission"], 1, "Hydrogen nuclei combine to form helium through nuclear fusion."], ["Which layer of the Sun is its visible surface?", ["Corona", "Core", "Photosphere", "Chromosphere"], 2, "The photosphere is the visible surface of the Sun."], ["Which part of the Sun has the highest temperature?", ["Photosphere", "Core", "Corona", "Outer surface"], 1, "The Sun's core is where nuclear fusion takes place and the temperature is highest."], ["What are the tiny points of light seen in the night sky called?", ["Planets", "Stars", "Asteroids", "Comets"], 1, "Stars are huge celestial bodies that emit their own light."], ["A group of stars forming a recognisable pattern is called a:", ["Galaxy", "Constellation", "Solar system", "Meteor"], 1, "A constellation is a group of stars forming a pattern in the sky."], ["Which of these is a constellation mentioned in the lesson?", ["Cassiopeia", "Jupiter", "Ceres", "Phobos"], 0, "Cassiopeia is one of the constellations shown in the lesson."], ["Asteroids are mainly found in the belt between which planets?", ["Earth and Mars", "Mars and Jupiter", "Jupiter and Saturn", "Saturn and Uranus"], 1, "The asteroid belt lies mainly between Mars and Jupiter."], ["A comet is mainly made up of:", ["Only iron", "Rocks, ice, dust and gas", "Only water", "Molten metal"], 1, "Comets contain ice, dust, rocky material and gases; they may develop a visible tail near the Sun."], ["What is the outermost layer of the Earth?", ["Mantle", "Outer core", "Crust", "Inner core"], 2, "The crust is Earth's outermost rocky layer."], ["Which is the thickest layer of the Earth?", ["Crust", "Mantle", "Outer core", "Inner core"], 1, "The mantle lies below the crust and is the thickest layer."], ["Which layer of Earth is liquid?", ["Crust", "Mantle", "Outer core", "Inner core"], 2, "The outer core is in a liquid state and contains mainly iron and nickel."], ["The inner core of Earth is mainly:", ["Liquid and cool", "Solid and very hot", "Gas and cold", "Made of water"], 1, "The inner core is solid due to immense pressure, despite its very high temperature."], ["What is the movement of Earth spinning on its axis called?", ["Revolution", "Rotation", "Orbiting", "Migration"], 1, "Rotation is Earth's spinning movement on its axis."], ["How long does Earth take to complete one rotation?", ["12 hours", "24 hours", "30 days", "365 days"], 1, "One rotation takes approximately 24 hours and causes day and night."], ["What causes day and night on Earth?", ["Earth's revolution", "Moon's rotation", "Earth's rotation", "The Sun moving around Earth"], 2, "The side facing the Sun has day, while the opposite side has night."], ["What is the movement of Earth around the Sun called?", ["Rotation", "Revolution", "Oscillation", "Orbit shift"], 1, "Earth's movement around the Sun along a fixed path is called revolution."], ["Approximately how long does Earth take to complete one revolution around the Sun?", ["24 hours", "28 days", "365¼ days", "30 days"], 2, "Earth takes about 365¼ days to complete one revolution."], ["What is the imaginary line passing through Earth's North and South Poles called?", ["Equator", "Axis", "Orbit", "Meridian"], 1, "Earth rotates around its imaginary axis."], ["What is the natural satellite of Earth?", ["The Sun", "Mars", "The Moon", "Venus"], 2, "The Moon is Earth's natural satellite."], ["Why does the Moon shine?", ["It produces its own light", "It reflects sunlight", "It reflects Earth's light only", "It is made of fire"], 1, "The Moon does not produce its own light; it reflects sunlight."], ["What is the phase called when the Moon is not visible from Earth?", ["Full Moon", "New Moon", "Half Moon", "Gibbous Moon"], 1, "During the New Moon, the illuminated side is turned away from Earth."], ["What is the phase called when the entire visible side of the Moon is illuminated?", ["Crescent Moon", "Half Moon", "Full Moon", "New Moon"], 2, "A Full Moon occurs when the whole visible face appears illuminated."], ["Approximately how long does one lunar cycle take?", ["7 days", "14 days", "28 days", "365 days"], 2, "A complete cycle of phases takes about 28 days."], ["What causes tides in the oceans?", ["The Moon's gravitational pull", "The Sun's heat", "Earth's rotation only", "Clouds and rainfall"], 0, "The Moon's gravity pulls ocean water and contributes to tides."], ["During which Moon phases do the highest tides generally occur?", ["Only Crescent Moon", "New Moon and Full Moon", "Only Half Moon", "Only Gibbous Moon"], 1, "The highest tides occur around New Moon and Full Moon."], ["When does a solar eclipse occur?", ["Earth comes between the Sun and Moon", "Moon comes between the Sun and Earth", "Sun comes between Earth and Moon", "Moon enters Earth's atmosphere"], 1, "A solar eclipse occurs when the Moon blocks sunlight from reaching part of Earth."], ["When does a lunar eclipse occur?", ["Moon comes between Sun and Earth", "Earth comes between Sun and Moon", "Sun comes between Earth and Moon", "The Moon disappears behind a cloud"], 1, "A lunar eclipse occurs when Earth casts its shadow on the Moon."], ["During a total lunar eclipse, the Moon is:", ["Inside the Sun", "Completely within Earth's dark shadow", "Between Earth and Sun", "Outside the solar system"], 1, "A total lunar eclipse occurs when the Moon is completely covered by Earth's dark shadow."], ["What are artificial satellites?", ["Natural objects orbiting the Sun", "Man-made objects that revolve around Earth", "Stars that orbit the Moon", "Pieces of the Sun"], 1, "Artificial satellites are human-made objects placed in orbit."], ["Which was the world's first artificial satellite?", ["Aryabhata", "Sputnik 1", "INSAT-1A", "Rohini"], 1, "Sputnik 1, launched in 1957, was the first artificial satellite."], ["What is the name of India's first satellite?", ["INSAT", "Bhaskara", "Aryabhata", "Rohini"], 2, "Aryabhata was India's first satellite, launched in 1975."], ["Which is a use of artificial satellites?", ["Weather forecasting", "Communication", "Navigation and research", "All of these"], 3, "Satellites support communication, weather forecasting, navigation, defence and research."], ["Who was the first human to travel into space?", ["Neil Armstrong", "Yuri Gagarin", "Rakesh Sharma", "Edwin Aldrin"], 1, "Yuri Gagarin of the Soviet Union became the first human in space in 1961."], ["Who was the first person to step on the Moon?", ["Michael Collins", "Edwin Aldrin", "Neil Armstrong", "Yuri Gagarin"], 2, "Neil Armstrong stepped onto the Moon on 20 July 1969."], ["Which Apollo 11 astronaut remained in the spacecraft orbiting the Moon?", ["Neil Armstrong", "Edwin Aldrin", "Michael Collins", "Yuri Gagarin"], 2, "Michael Collins remained in the command module while Armstrong and Aldrin descended to the Moon."], ["Who was the first Indian to travel into space?", ["Kalpana Chawla", "Sunita Williams", "Rakesh Sharma", "Vikram Sarabhai"], 2, "Rakesh Sharma became the first Indian to travel into space in 1984."], ["Why do astronauts wear spacesuits in space?", ["To make them heavier", "To provide protection and a suitable environment", "To help them breathe underwater", "To increase gravity"], 1, "Spacesuits provide oxygen, pressure and protection in the space environment."]];
const letters=['A','B','C','D'];let chosen={};let finished=false;
const root=document.getElementById('quiz');
function render(){root.innerHTML=data.map((q,i)=>`<section class="q" id="q${i}"><div class="qhead"><span class="num">${i+1}</span><div style="flex:1"><h3>${q[0]}</h3></div></div><div class="opts">${q[1].map((o,j)=>`<button class="opt" data-q="${i}" data-a="${j}" ${finished?'disabled':''}>${letters[j]}. ${o}</button>`).join('')}</div><div class="feedback" id="f${i}"></div></section>`).join('');
root.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.q,+b.dataset.a)));update();}
function answer(i,a){if(finished||chosen[i]!==undefined)return;chosen[i]=a;const correct=data[i][2],buttons=document.querySelectorAll(`#q${i} .opt`),fb=document.getElementById('f'+i);buttons.forEach((b,j)=>{b.disabled=true;if(j===correct)b.classList.add('correct');if(j===a&&a!==correct)b.classList.add('wrong')});fb.className='feedback show '+(a===correct?'good':'bad');fb.innerHTML=(a===correct?'Correct. ':'Not quite. Correct answer: <b>'+letters[correct]+'. '+data[i][1][correct]+'</b>. ')+data[i][3];update();}
function update(){let n=Object.keys(chosen).length,score=Object.keys(chosen).filter(i=>chosen[i]===data[i][2]).length;document.getElementById('status').textContent=`${n} of ${data.length} answered`;document.getElementById('bar').style.width=(n/data.length*100)+'%';document.getElementById('liveScore').textContent='Score: '+score;}
document.getElementById('finish').onclick=()=>{if(finished)return;finished=true;let correct=0,wrong=0,unanswered=0;data.forEach((q,i)=>{if(chosen[i]===undefined){unanswered++;const fb=document.getElementById('f'+i);fb.className='feedback show bad';fb.innerHTML='Not answered. Correct answer: <b>'+letters[q[2]]+'. '+q[1][q[2]]+'</b>. '+q[3];document.querySelectorAll(`#q${i} .opt`)[q[2]].classList.add('correct')}else if(chosen[i]===q[2])correct++;else wrong++;document.querySelectorAll(`#q${i} .opt`).forEach(b=>b.disabled=true)});document.getElementById('score').textContent=`${correct} / ${data.length}`;document.getElementById('remark').textContent=correct>=45?'Excellent work!':correct>=35?'Very good effort!':correct>=25?'Good attempt — revise and try again.':'Keep practising — you can improve!';document.getElementById('summary').textContent=`Correct: ${correct} · Incorrect: ${wrong} · Unanswered: ${unanswered}`;document.getElementById('result').classList.add('show');document.getElementById('result').scrollIntoView({behavior:'smooth'});document.getElementById('finish').disabled=true;update();};
document.getElementById('reset').onclick=()=>{chosen={};finished=false;document.getElementById('result').classList.remove('show');document.getElementById('finish').disabled=false;render();window.scrollTo({top:0,behavior:'smooth'})};
document.getElementById('review').onclick=()=>{let first=data.findIndex((q,i)=>chosen[i]!==q[2]);if(first>=0)document.getElementById('q'+first).scrollIntoView({behavior:'smooth'});};render();
</script></body></html>
