<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Math Ma’am Academy | Matter and Materials</title>
<style>
 :root{--ink:#172033;--muted:#64748b;--line:#e2e8f0;--blue:#2457c5;--bg:#f4f7fb;--good:#087443;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 14px 50px}.hero{background:linear-gradient(135deg,#172554,#2563eb);color:white;padding:26px;border-radius:20px;margin-bottom:18px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;opacity:.8;font-weight:700}.hero h1{margin:6px 0;font-size:clamp(1.7rem,5vw,2.5rem)}.hero p{margin:4px 0 0;opacity:.9}.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.pill{background:#ffffff20;border:1px solid #ffffff40;padding:6px 11px;border-radius:99px;font-size:.85rem}.intro,.q,.result{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin:13px 0;box-shadow:0 2px 8px #0f172a08}.intro h2{margin-top:0}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0}.progress{height:8px;background:#dbe4f0;border-radius:99px;overflow:hidden;flex:1;min-width:120px}.progress span{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}.stats{font-size:.9rem;color:var(--muted)}.qhead{display:flex;gap:10px;align-items:flex-start}.num{flex:none;background:#eaf0ff;color:#1d4ed8;border-radius:9px;padding:3px 9px;font-weight:800}.q h2{font-size:1.02rem;margin:2px 0 14px;font-weight:650}.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}.opt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;background:white;color:var(--ink);font:inherit;cursor:pointer;transition:.15s}.opt:hover{border-color:#8aa8ef;background:#f8faff}.opt.selected{border-color:#4c84bc;background:#edf5ff}.opt:disabled{cursor:default;opacity:1}.opt.correct{border-color:#16a36a;background:#ecfdf3;color:#065f46}.opt.wrong{border-color:#e05a52;background:#fff1f0;color:#9f1d18}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:11px;padding:11px 17px;font:600 .95rem system-ui;cursor:pointer}.primary{background:var(--blue);color:white}.secondary{background:#e8edf5;color:#243047}.btn:disabled{opacity:.45;cursor:not-allowed}.result{display:none}.result.show{display:block}.score{font-size:2.4rem;font-weight:850;color:var(--blue)}.small{color:var(--muted);font-size:.9rem}.explanation{display:none;margin-top:11px;padding:10px 12px;border-radius:10px;background:#f1f5f9;color:#334155;font-size:.92rem}.explanation.show{display:block}.footer{text-align:center;color:var(--muted);font-size:.85rem;margin-top:28px}@media(max-width:620px){.opts{grid-template-columns:1fr}.q{padding:15px}.hero{padding:21px}}
[hidden]{display:none!important}
</style></head><body><main class="wrap">
<header class="hero"><div class="eyebrow">Class 5 · Science</div><h1>Matter and Materials</h1><p>50 multiple-choice questions · 50 marks</p><div class="meta"><span class="pill">45-minute test</span><span class="pill">States · Changes · Solutions · Properties</span></div></header>
<div class="toolbar" id="toolbar"><div class="stats" id="status">0 of 50 answered</div><div class="progress"><span id="bar"></span></div><div class="stats" id="timer" role="timer">45:00</div></div>
<div id="quiz"></div>
<div class="actions" id="testActions"><button class="btn primary" id="finish">Submit Test</button><button class="btn secondary" id="reset">Reset Test</button></div>
<section class="result" id="result" aria-live="polite"><div class="eyebrow" style="color:#64748b">Your result</div><div class="score" id="score"></div><h2 id="remark"></h2><p id="summary" class="small"></p><button class="btn secondary" id="retake">Retake Test</button></section>
<div class="footer">Math Ma’am Academy · Where Every Subject Clicks.</div></main>
<script>
const questions=[["Anything that has mass and occupies space is called:", ["Energy", "Matter", "Force", "Light"], 1, "Matter is anything that has mass and occupies space."], ["Matter is made up of very small particles called:", ["Cells", "Molecules", "Fibres", "Tissues"], 1, "Molecules are very small particles that make up matter."], ["Molecules are further composed of very small particles called:", ["Atoms", "Organs", "Crystals", "Droplets"], 0, "Molecules are composed of atoms."], ["Which set contains the three states of matter?", ["Solid, liquid and gas", "Solid, metal and gas", "Water, ice and steam only", "Hard, soft and liquid"], 0, "The three states of matter are solid, liquid and gas."], ["In which state are molecules packed very tightly in a regular arrangement?", ["Gas", "Liquid", "Solid", "Vapour"], 2, "In solids, molecules are very close and regularly arranged."], ["Which state of matter has a definite shape and a definite volume?", ["Solid", "Liquid", "Gas", "All three"], 0, "Solids have a definite shape and a definite volume."], ["Which statement about liquids is correct?", ["They have a definite shape", "They have a definite volume but no definite shape", "They have neither definite shape nor volume", "They cannot flow"], 1, "Liquids take the shape of their container but their volume remains the same."], ["Why can gases fill the entire space available to them?", ["Their molecules are tightly packed", "Their molecules cannot move", "Their molecules move freely in all directions", "They have a fixed shape"], 2, "Gas molecules are far apart and move freely in all directions."], ["Which of the following is a gas?", ["Milk", "Petrol", "Oxygen", "Oil"], 2, "Oxygen is an example of a gas."], ["Which group contains only liquids?", ["Water, petrol, soft drink", "Oxygen, milk, oil", "Stone, water, milk", "Carbon dioxide, nitrogen, water"], 0, "Water, petrol and soft drink are liquids."], ["Which change of state occurs when a liquid changes into gas at any temperature below its boiling point?", ["Freezing", "Evaporation", "Condensation", "Melting"], 1, "Evaporation changes a liquid into gas and can occur below the boiling point."], ["Which factor does NOT affect the rate of evaporation according to the lesson?", ["Surface area", "Temperature", "Wind", "Colour of the container"], 3, "The lesson identifies surface area, temperature and wind as factors affecting evaporation."], ["Water drying from a wet floor is an example of:", ["Condensation", "Evaporation", "Freezing", "Sublimation"], 1, "Water changes into water vapour by evaporation."], ["What happens to the rate of evaporation when temperature increases?", ["It decreases", "It increases", "It becomes zero", "It remains unchanged"], 1, "Higher temperature makes molecules move faster, increasing evaporation."], ["The conversion of a solid into a liquid on heating is called:", ["Freezing", "Melting", "Condensation", "Sublimation"], 1, "Melting is the change from solid to liquid on heating."], ["Ice cubes changing into water is an example of:", ["Melting", "Freezing", "Sublimation", "Condensation"], 0, "Ice melts when heated or taken out of a refrigerator."], ["The conversion of a solid directly into gas on heating is called:", ["Evaporation", "Condensation", "Sublimation", "Freezing"], 2, "Sublimation is a direct change from solid to gas without becoming liquid."], ["Which substance is given as an example of sublimation in the lesson?", ["Naphthalene", "Salt", "Sugar", "Iron"], 0, "Naphthalene balls slowly change directly into gas."], ["The conversion of gas into liquid on cooling is called:", ["Melting", "Condensation", "Freezing", "Sublimation"], 1, "During condensation, gas molecules cool, slow down and come closer together."], ["Water vapour forming droplets on a cold surface is an example of:", ["Evaporation", "Condensation", "Melting", "Sublimation"], 1, "Water vapour cools on the cold surface and condenses into liquid water."], ["The conversion of a liquid into solid on cooling is called:", ["Freezing", "Melting", "Evaporation", "Condensation"], 0, "Freezing changes a liquid into its solid form."], ["Which pair shows opposite processes?", ["Evaporation and condensation", "Melting and evaporation", "Sublimation and melting", "Heating and evaporation"], 0, "Evaporation changes liquid to gas, while condensation changes gas to liquid."], ["What happens to the movement of molecules when a substance is cooled?", ["It becomes faster", "It slows down", "It stops permanently", "It becomes irregular only"], 1, "Cooling reduces molecular movement."], ["Expansion occurs when a substance is:", ["Cooled", "Heated", "Frozen", "Dissolved"], 1, "On heating, molecules move more rapidly and take up more space."], ["Why can a tight metal lid on a glass jar be opened more easily after dipping it in hot water?", ["The glass contracts", "The metal lid expands", "The water dissolves the lid", "The jar becomes lighter"], 1, "Heating causes the metal lid to expand slightly."], ["What is contraction?", ["Increase in size on heating", "Decrease in size on cooling", "Change from solid to liquid", "Change from gas to liquid"], 1, "On cooling, molecules move less and the substance contracts."], ["Electric cables hang loosely in summer because they:", ["Contract in summer", "Expand in summer", "Melt in summer", "Evaporate in summer"], 1, "Cables expand in summer and contract in winter."], ["Why can a completely filled water bottle kept in a freezer break?", ["Water evaporates", "Water expands on freezing", "Water contracts on freezing", "The bottle dissolves"], 1, "Water expands on freezing and may break a completely filled bottle."], ["The substance that gets dissolved in a solution is called the:", ["Solvent", "Solute", "Mixture", "Residue"], 1, "The solute is the substance that dissolves."], ["The substance in which the solute dissolves is called the:", ["Solvent", "Solute", "Crystal", "Suspension"], 0, "The solvent dissolves the solute."], ["Sugar dissolved in water forms a:", ["Suspension", "Solution", "Pure element", "Gas"], 1, "Sugar is the solute and water is the solvent in a sugar solution."], ["In a sugar solution, the solute is ___ and the solvent is ___.", ["Water, sugar", "Sugar, water", "Both sugar", "Both water"], 1, "Sugar dissolves in water; therefore sugar is the solute and water is the solvent."], ["Which is an example of a gas dissolved in a liquid?", ["Brass", "Soft drink", "Sugar solution", "Mercury in gold"], 1, "Carbon dioxide gas is dissolved in water in a soft drink."], ["In a soft drink, which gas is dissolved in water?", ["Oxygen", "Nitrogen", "Carbon dioxide", "Hydrogen"], 2, "Carbon dioxide is dissolved in water under pressure."], ["Which pair forms an example of a solid dissolved in a solid?", ["Sugar solution", "Brass", "Ethanol in water", "Soft drink"], 1, "Brass is an alloy in which zinc is dissolved in copper."], ["Liquids that dissolve completely in each other are called:", ["Immiscible liquids", "Miscible liquids", "Insoluble liquids", "Suspensions"], 1, "Miscible liquids mix completely to form a single layer."], ["Which pair is an example of immiscible liquids?", ["Water and vinegar", "Water and oil", "Ethanol and water", "Water and alcohol"], 1, "Oil does not dissolve in water and forms a separate layer."], ["A physical change is one in which:", ["A new substance is always formed", "Only physical properties change and no new substance forms", "The chemical composition always changes", "The change cannot be reversed"], 1, "In a physical change, no new substance is formed."], ["Which of the following is a physical change?", ["Rusting of iron", "Burning of paper", "Melting of chocolate", "Souring of milk"], 2, "Melting changes the state of chocolate without forming a new substance."], ["Which of the following is a chemical change?", ["Breaking a pencil", "Melting ice", "Dissolving sugar", "Rusting of iron"], 3, "Rusting forms a new substance with different properties."], ["A chemical change results in:", ["No change in composition", "Formation of a new substance", "Only a change in shape", "Only a change in size"], 1, "Chemical changes alter chemical composition and form new substances."], ["Which of these is generally a permanent change that cannot be reversed easily?", ["Melting ice", "Breaking a pencil", "Burning paper", "Dissolving sugar"], 2, "Burning paper forms new substances and cannot be reversed."], ["Materials that allow light to pass through completely are called:", ["Opaque", "Translucent", "Transparent", "Lustrous"], 2, "Transparent materials allow light to pass through completely."], ["Which is an example of a translucent material?", ["Clear glass", "Frosted glass", "Wood", "Metal sheet"], 1, "Frosted glass allows light to pass partially."], ["Materials that do not allow light to pass through are called:", ["Transparent", "Translucent", "Opaque", "Lustrous"], 2, "Opaque materials block light."], ["The shine seen on a material is known as:", ["Texture", "Lustre", "Density", "Solubility"], 1, "Lustre is the shining property of a material."], ["Materials that cannot be scratched easily are called:", ["Soft", "Hard", "Rough", "Translucent"], 1, "Hard materials resist scratching."], ["The feel of the surface of a material is called its:", ["Density", "Texture", "Lustre", "Conductivity"], 1, "Texture describes how a material feels, such as rough or smooth."], ["Materials that dissolve completely in water are called:", ["Insoluble", "Soluble", "Opaque", "Magnetic"], 1, "Soluble materials dissolve in water."], ["Which material is attracted towards a magnet?", ["Plastic", "Rubber", "Iron", "Wood"], 2, "Iron is a magnetic material."]];let current=0,answers=Array(questions.length).fill(null),locked=Array(questions.length).fill(false);
const quizRoot=document.getElementById('quiz'),statusText=document.getElementById('status'),progressBar=document.getElementById('bar'),timerText=document.getElementById('timer'),resultPanel=document.getElementById('result');
let selectedAnswers=Array(questions.length).fill(null),remainingSeconds=45*60,timerInterval=null,finished=false;
function startTest(){if(timerInterval!==null)return;renderQuestions();updateProgress();timerInterval=window.setInterval(updateTimer,1000)}
function renderQuestions(){quizRoot.replaceChildren();questions.forEach((question,index)=>{const card=document.createElement('section');card.className='q';const heading=document.createElement('div');heading.className='qhead';const number=document.createElement('span');number.className='num';number.textContent=index+1;const title=document.createElement('h2');title.textContent=question[0];heading.append(number,title);card.append(heading);const options=document.createElement('div');options.className='opts';question[1].forEach((option,optionIndex)=>{const button=document.createElement('button');button.type='button';button.className='opt';button.textContent=`${String.fromCharCode(65+optionIndex)}. ${option}`;button.setAttribute('aria-pressed','false');button.addEventListener('click',()=>selectAnswer(index,optionIndex));options.append(button)});card.append(options);const explanation=document.createElement('div');explanation.className='explanation';card.append(explanation);quizRoot.append(card)})}
function selectAnswer(questionIndex,optionIndex){if(finished)return;selectedAnswers[questionIndex]=optionIndex;const buttons=quizRoot.children[questionIndex].querySelectorAll('.opt');buttons.forEach((button,index)=>{button.classList.toggle('selected',index===optionIndex);button.setAttribute('aria-pressed',String(index===optionIndex))});updateProgress()}
function updateProgress(){const answered=selectedAnswers.filter(answer=>answer!==null).length;statusText.textContent=`${answered} of ${questions.length} answered`;progressBar.style.width=`${answered/questions.length*100}%`}
function updateTimer(){remainingSeconds=Math.max(0,remainingSeconds-1);timerText.textContent=`${Math.floor(remainingSeconds/60)}:${String(remainingSeconds%60).padStart(2,'0')}`;if(remainingSeconds===0)submitTest(true)}
function submitTest(timeExpired=false){if(finished)return;finished=true;window.clearInterval(timerInterval);let correct=0,wrong=0,unanswered=0;questions.forEach((question,index)=>{const buttons=quizRoot.children[index].querySelectorAll('.opt'),answer=selectedAnswers[index];buttons.forEach((button,optionIndex)=>{button.disabled=true;if(optionIndex===question[2])button.classList.add('correct');if(answer===optionIndex&&answer!==question[2])button.classList.add('wrong')});if(answer===null)unanswered++;else if(answer===question[2])correct++;else wrong++;const explanation=quizRoot.children[index].querySelector('.explanation');explanation.textContent=question[3];explanation.classList.add('show')});document.getElementById('score').textContent=`${correct} / ${questions.length}`;document.getElementById('remark').textContent=correct>=45?'Excellent work!':correct>=35?'Very good effort!':correct>=25?'Good attempt — review the highlighted answers.':'Keep practising — review the highlighted answers and try again.';document.getElementById('summary').textContent=`Correct: ${correct} · Incorrect: ${wrong} · Unanswered: ${unanswered}${timeExpired?' · Time is up.':''}`;resultPanel.classList.add('show');document.getElementById('finish').disabled=true;resultPanel.scrollIntoView({behavior:'smooth'})}
document.getElementById('finish').addEventListener('click',()=>submitTest());document.getElementById('reset').addEventListener('click',()=>window.location.reload());document.getElementById('retake').addEventListener('click',()=>window.location.reload());startTest();
</script></body></html>
