<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  if (localStorage.getItem('mm_auth') !== '1') {
    window.location.replace('../../login.html');
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Human Body & Health — Std V Science Olympiad Test</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1c2333; --muted:#5b6478;
  --accent:#3556d8; --accent-light:#e8edfd; --correct:#1f8a4c; --correct-bg:#e5f7ec;
  --wrong:#c0392b; --wrong-bg:#fdeceb; --border:#e1e5f0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12141c; --card:#1b1f2c; --text:#e8ebf5; --muted:#a2a9bd;
    --accent:#7d93ff; --accent-light:#232a45; --correct:#4ad080; --correct-bg:#14301f;
    --wrong:#ff6f61; --wrong-bg:#3a1a17; --border:#2b3145;
  }
}
:root[data-theme="dark"]{
  --bg:#12141c; --text:#e8ebf5; --card:#1b1f2c; --muted:#a2a9bd;
  --accent:#7d93ff; --accent-light:#232a45; --correct:#4ad080; --correct-bg:#14301f;
  --wrong:#ff6f61; --wrong-bg:#3a1a17; --border:#2b3145;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px;}
header{text-align:center;margin-bottom:20px;}
h1{font-size:1.4rem;margin:0 0 4px;}
.sub{color:var(--muted);font-size:0.9rem;margin-bottom:10px;}
.meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;}
.badge{background:var(--accent-light);color:var(--accent);padding:4px 10px;border-radius:20px;font-size:0.78rem;font-weight:600;}
.section-title{margin:28px 0 12px;font-size:1.05rem;color:var(--accent);border-bottom:2px solid var(--accent-light);padding-bottom:6px;}
.q{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;}
.q-text{font-weight:600;margin-bottom:10px;font-size:0.95rem;}
.opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:6px;border:1px solid var(--border);cursor:pointer;font-size:0.9rem;transition:background .15s;}
.opt:hover{background:var(--accent-light);}
.opt input{accent-color:var(--accent);}
.opt.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);font-weight:600;}
.opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong);font-weight:600;}
.opt.locked{cursor:default;}
#submitBar{position:sticky;bottom:0;background:var(--bg);padding:14px 0;text-align:center;border-top:1px solid var(--border);margin-top:20px;}
button{background:var(--accent);color:#fff;border:none;padding:12px 30px;border-radius:30px;font-size:1rem;font-weight:600;cursor:pointer;}
button:disabled{opacity:0.6;}
#scoreBox{display:none;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:20px;position:sticky;top:8px;z-index:5;}
#scoreBox h2{margin:0 0 6px;font-size:1.6rem;color:var(--accent);}
#scoreBox p{margin:0;color:var(--muted);font-size:0.85rem;}
.unanswered{outline:2px solid var(--wrong);}
#timer{position:sticky;top:8px;z-index:4;margin:0 auto 14px;width:max-content;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Human Body &amp; Health</h1>
  <div class="sub">Std V &middot; Science Olympiad &middot; Maharashtra State Board</div>
  <div class="meta">
    <span class="badge">100 MCQs</span>
    <span class="badge">60 minutes</span>
    <span class="badge">Skeletal &amp; Muscular</span>
    <span class="badge">Nervous System</span>
    <span class="badge">Food &amp; Health</span>
    <span class="badge">Diseases &amp; Prevention</span>
    <span class="badge">Safety &amp; First Aid</span>
  </div>
</header>

<div id="timer" aria-live="polite">Time remaining: 60:00</div>

<div id="scoreBox">
  <h2 id="scoreText">0 / 100</h2>
  <p id="scoreSub">Correct answers are shown in green, your wrong picks in red.</p>
</div>

<div id="quiz"></div>

<div id="submitBar">
  <button id="submitBtn">Submit Test</button>
</div>
</div>

<script>
const DATA = [

["The knee joint is an example of which type of joint?",["Hinge joint","Ball and socket joint","Fixed joint","Gliding joint"],0],

["One main function of the human skeleton is to give the body its?",["Shape and support","Colour","Taste sense","Digestive ability"],0],
["Besides the shoulder, which other joint in the body is a ball and socket joint?",["Hip joint","Elbow joint","Knee joint","Wrist joint"],0]
]],
["Nervous System",[
["Which organ acts as the control centre of the human body?",["Brain","Heart","Liver","Lungs"],0],
["The brain is protected by a bony case called the?",["Skull","Rib cage","Spine","Pelvis"],0],
["Which part of the brain controls balance and coordination?",["Cerebellum","Cerebrum","Medulla","Spinal cord"],0],

["How many main sense organs does the human body have?",["Five","Four","Six","Three"],0],

]],

["Deficiency of iodine in the body leads to which condition?",["Goitre","Anaemia","Scurvy","Night blindness"],0],
["Milk is a particularly rich source of which mineral?",["Calcium","Iron","Iodine","Sodium"],0],
["Calcium is especially important for the health of our?",["Bones and teeth","Blood","Skin","Hair"],0],
["Roughage or dietary fibre mainly helps the body by?",["Aiding digestion and preventing constipation","Giving energy","Building muscles","Fighting infection"],0],
["Fruits and vegetables are often called the?",["Protective food group","Energy-giving food group","Body-building food group","Fatty food group"],0],
["Carbohydrates and fats together are usually called the?",["Energy-giving food group","Protective food group","Body-building food group","Regulatory food group"],0],
["Proteins are usually called the?",["Body-building food group","Energy-giving food group","Protective food group","Fatty food group"],0],
["In which part of the body does the digestion of food begin?",["Mouth","Stomach","Small intestine","Large intestine"],0],
["Which juice in the stomach helps to digest food?",["Gastric juice","Saliva only","Bile only","Sweat"],0],
["Drinking sufficient water every day is important mainly for?",["Digestion and keeping the body hydrated","Building muscles only","Improving eyesight only","Growing hair"],0]
]],

["Diseases that spread from one person to another are called?",["Communicable diseases","Non-communicable diseases","Genetic diseases","Deficiency diseases"],0],

["Cholera is a disease that mainly spreads through?",["Contaminated water or food","Mosquito bites","Air only","Animal bites"],0],
["Typhoid fever mainly spreads through?",["Contaminated food and water","Mosquito bites","Direct sunlight","Cold weather"],0],

["Covering the mouth and nose while coughing helps prevent the spread of?",["Airborne diseases","Skin diseases","Deficiency diseases","Bone diseases"],0],
["Diabetes is an example of a?",["Non-communicable disease","Communicable disease","Deficiency disease caused by germs","Water-borne disease"],0],
["Malaria and dengue are both spread because of mosquitoes breeding in?",["Stagnant water","Dry soil","Clean flowing rivers","Cold air"],0],
["Boiling water before drinking mainly helps to prevent?",["Water-borne diseases","Skin diseases","Bone diseases","Eye diseases"],0],
["Germs that cause diseases, such as bacteria and viruses, are also called?",["Pathogens or microbes","Antibodies","Vitamins","Nutrients"],0],
["Rabies is a dangerous disease usually caused by the bite of a?",["Rabid dog or animal","Mosquito","Housefly","Cockroach"],0],
["Which of the following is NOT a communicable disease?",["Diabetes","Malaria","Tuberculosis","Common cold"],0]
]],
["Safety and First Aid",[
["First aid means?",["Immediate help given to an injured person before the doctor arrives","Treatment given only by a doctor","Medicine taken every day","Surgery performed at home"],0],
["In case of a minor cut, the first step of first aid is to?",["Clean the wound with water","Apply oil","Cover it with mud","Ignore it"],0],
["In case of a minor burn, the first step of first aid is to?",["Cool the area under running water","Apply butter","Apply ice directly","Rub the area hard"],0],
["In case of a suspected fracture (broken bone), what should be done first?",["Keep the part still and get medical help","Try to walk on it immediately","Massage it hard","Ignore the pain"],0],
["Which emergency helpline number is commonly used in India for urgent help?",["112","911","000","119"],0],
["Which is an important safety rule while crossing a road?",["Look both sides and use a zebra crossing","Run across quickly","Cross while looking at your phone","Cross from anywhere"],0],
["What should be avoided when your hands are wet, for safety?",["Touching electrical switches","Drinking water","Reading a book","Wearing shoes"],0],
["A box containing bandages, antiseptic, and other emergency items is called a?",["First aid kit","Lunch box","Tool box","Medicine shop"],0],
["In case of a nosebleed, what is the correct first aid step?",["Tilt the head slightly forward and pinch the nose","Tilt the head fully backward","Lie down flat immediately","Run around"],0],
["What is an important safety measure while handling sharp objects like scissors?",["Handle them carefully and store them safely","Play with them","Leave them anywhere","Throw them"],0],

["A bandage is used mainly to?",["Cover and protect a wound","Cure the disease completely","Replace medicine","Remove pain permanently"],0],
["In case of a fire, what should you do first?",["Stay calm, move away, and call for help","Try to put it out with bare hands","Hide inside a cupboard","Ignore it"],0],
["If someone is choking, a helper can give which type of first aid?",["Back blows to help clear the airway","Give them water immediately","Make them lie down flat","Ignore and wait"],0],
["Which is an important safety rule to follow in a science laboratory?",["Follow the teacher's instructions and handle materials carefully","Taste unknown chemicals","Run around freely","Mix chemicals randomly"],0],
["Which safety gear should be worn while riding a bicycle?",["Helmet","Sunglasses only","Gloves only","Scarf only"],0],
["If your clothes catch fire, what is the correct action?",["Stop, drop, and roll","Run as fast as possible","Wave your arms in the air","Jump into a small container"],0],
["Ice packs should not be applied directly on the skin; they should be?",["Wrapped in a cloth","Applied for a very long time","Heated first","Rubbed hard on skin"],0],
["A basic emergency kit at home should always contain items like?",["Bandages, antiseptic, cotton, and scissors","Toys and books","Food and snacks","Old newspapers"],0]
]]
];

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let flat = [];
DATA.forEach(sec => sec[1].forEach(q => {
  const correctText = q[1][q[2]];
  const shuffledOpts = shuffle(q[1]);
  const newCorrectIdx = shuffledOpts.indexOf(correctText);
  flat.push([q[0], shuffledOpts, newCorrectIdx]);
}));

const quizEl = document.getElementById('quiz');
const TEST_DURATION_SECONDS = 60 * 60;
const SOLUTION_UNLOCK_SECONDS = 30 * 60;
const TIMER_STORAGE_KEY = 'human-body-health-started-at';
const startedAt = Number(sessionStorage.getItem(TIMER_STORAGE_KEY)) || Date.now();
sessionStorage.setItem(TIMER_STORAGE_KEY, String(startedAt));
const isTeacher = localStorage.getItem('mm_role') === 'teacher';
let submitted = false;
let qNum = 0;
let flatPtr = 0;
DATA.forEach(section => {
  const h = document.createElement('div');
  h.className = 'section-title';
  h.textContent = section[0];
  quizEl.appendChild(h);
  section[1].forEach(() => {
    const q = flat[flatPtr];
    const idx = flatPtr;
    flatPtr++;
    qNum++;
    const qDiv = document.createElement('div');
    qDiv.className = 'q';
    qDiv.id = 'q' + idx;
    const qt = document.createElement('div');
    qt.className = 'q-text';
    qt.textContent = qNum + '. ' + q[0];
    qDiv.appendChild(qt);
    q[1].forEach((opt, oi) => {
      const label = document.createElement('label');
      label.className = 'opt';
      label.id = 'q' + idx + '_o' + oi;
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'q' + idx;
      input.value = oi;
      label.appendChild(input);
      const span = document.createElement('span');
      span.textContent = opt;
      label.appendChild(span);
      qDiv.appendChild(label);
    });
    quizEl.appendChild(qDiv);
  });
});

function submitTest() {
  if (submitted) return;
  submitted = true;
  const elapsedSeconds = Math.floor((Date.now() - startedAt) / 1000);
  const showSolutions = isTeacher || elapsedSeconds > SOLUTION_UNLOCK_SECONDS;
  let score = 0;
  let firstUnanswered = null;
  flat.forEach((q, idx) => {
    const selected = document.querySelector('input[name="q'+idx+'"]:checked');
    const correctIdx = q[2];
    for (let oi = 0; oi < q[1].length; oi++) {
      const label = document.getElementById('q'+idx+'_o'+oi);
      const input = label.querySelector('input');
      input.disabled = true;
      label.classList.add('locked');
      if (showSolutions && oi === correctIdx) label.classList.add('correct');
    }
    if (selected) {
      const selIdx = parseInt(selected.value);
      if (selIdx === correctIdx) {
        score++;
      } else {
        if (showSolutions) document.getElementById('q'+idx+'_o'+selIdx).classList.add('wrong');
      }
    } else {
      if (firstUnanswered === null) firstUnanswered = idx;
      document.getElementById('q'+idx).classList.add('unanswered');
    }
  });
  document.getElementById('scoreText').textContent = score + ' / ' + flat.length;
  const unansweredCount = flat.filter((q, idx) => !document.querySelector('input[name="q'+idx+'"]:checked')).length;
  document.getElementById('scoreSub').textContent = !showSolutions
    ? 'Your answers are recorded. Solutions unlock only after more than 30 minutes of test time.'
    : unansweredCount > 0
    ? unansweredCount + ' question(s) left unanswered (marked in red). Correct answers are shown in green.'
    : 'Correct answers are shown in green, your wrong picks in red.';
  document.getElementById('scoreBox').style.display = 'block';
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').textContent = 'Submitted';
  window.scrollTo({top: 0, behavior: 'smooth'});
}

document.getElementById('submitBtn').addEventListener('click', submitTest);

function updateTimer() {
  const elapsedSeconds = Math.floor((Date.now() - startedAt) / 1000);
  const remainingSeconds = Math.max(0, TEST_DURATION_SECONDS - elapsedSeconds);
  const minutes = String(Math.floor(remainingSeconds / 60)).padStart(2, '0');
  const seconds = String(remainingSeconds % 60).padStart(2, '0');
  document.getElementById('timer').textContent = 'Time remaining: ' + minutes + ':' + seconds;
  if (remainingSeconds === 0) submitTest();
}

updateTimer();
const timerInterval = window.setInterval(() => {
  updateTimer();
  if (submitted) window.clearInterval(timerInterval);
}, 1000);
</script>
</body>
</html>
