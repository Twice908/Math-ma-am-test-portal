<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Class 4 Maths Quiz — Chapter 4: Thousands Around Us</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1b2333; --muted:#5b6472;
  --accent:#a1451e; --accent-light:#fbe9e0; --correct:#1f9d55; --correct-bg:#e6f7ec;
  --wrong:#e0483e; --wrong-bg:#fdeceb; --border:#e3e7ef;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --card:#1b202b; --text:#e9edf5; --muted:#9aa3b2;
    --accent:#f0906a; --accent-light:#32211b; --correct:#4ade80; --correct-bg:#16301f;
    --wrong:#f87171; --wrong-bg:#3a1d1c; --border:#2a2f3d;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c; --card:#1b202b; --text:#e9edf5; --muted:#9aa3b2;
  --accent:#f0906a; --accent-light:#32211b; --correct:#4ade80; --correct-bg:#16301f;
  --wrong:#f87171; --wrong-bg:#3a1d1c; --border:#2a2f3d;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;}
header{position:sticky;top:env(safe-area-inset-top,0px);padding:16px 20px calc(16px + env(safe-area-inset-top,0px));background:var(--accent);color:#fff;text-align:center;}
header h1{margin:0;font-size:1.1rem;}
header p{margin:4px 0 0;font-size:.85rem;opacity:.9;}
main{max-width:720px;margin:0 auto;padding:16px 14px 60px;}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;}
.q-num{font-weight:700;color:var(--accent);margin-bottom:6px;font-size:.85rem;}
.q-text{font-weight:600;margin-bottom:12px;font-size:1rem;}
.opts{display:grid;gap:8px;}
label.opt{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:.95rem;transition:background .15s,border-color .15s;}
label.opt:hover{background:var(--accent-light);}
label.opt input{accent-color:var(--accent);width:16px;height:16px;flex-shrink:0;}
label.opt.correct{background:var(--correct-bg);border-color:var(--correct);}
label.opt.wrong{background:var(--wrong-bg);border-color:var(--wrong);}
.explain{display:none;margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-light);font-size:.88rem;color:var(--text);}
.explain.show{display:block;}
.explain b{color:var(--accent);}
.actions{position:sticky;bottom:0;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top, var(--bg) 70%, transparent);text-align:center;}
button{background:var(--accent);color:#fff;border:none;border-radius:999px;padding:12px 32px;font-size:1rem;font-weight:600;cursor:pointer;}
button:disabled{opacity:.6;}
#result{max-width:720px;margin:0 auto 10px;padding:0 14px;}
.score-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center;margin-top:10px;}
.score-card h2{margin:0 0 6px;color:var(--accent);}
.unanswered{font-size:.75rem;color:var(--wrong);margin-top:4px;}
</style>
</head>
<body>
<header>
  <h1>Mathematics — Thousands Around Us</h1>
  <p>Class IV &middot; Chapter 4 &middot; 20 Questions &middot; Choose the correct answer</p>
</header>
<main>
  <form id="quiz"></form>
  <div class="actions"><button id="submitBtn" type="button">Submit Test</button></div>
  <div id="result"></div>
</main>

<script>
const questions = [
{q:"We are at 650. How much more to make 1000? 650 + ___ = 1000", opts:["350","340","360","450"], correct:0, exp:"1000 &minus; 650 = 350."},
{q:"Which number is made by 34 Tens and 12 Ones?", opts:["352","342","362","340"], correct:0, exp:"34 Tens = 340; 340 + 12 Ones = 352."},
{q:"Which number is represented by 4000 + 80 + 5?", opts:["4085","4805","4058","4850"], correct:0, exp:"4000 + 80 + 5 = 4085, with 4 Thousands, 0 Hundreds, 8 Tens and 5 Ones."},
{q:"Which comparison is correct?", opts:["3180 &lt; 3810","3180 &gt; 3810","3180 = 3810","Cannot be compared"], correct:0, exp:"Comparing the hundreds digit: 3180 has 1 Hundred while 3810 has 8 Hundreds, so 3180 &lt; 3810."},
{q:"Which of these numbers lies between 3315 and 4315?", opts:["3820","4405","3300","2900"], correct:0, exp:"3820 is greater than 3315 and less than 4315, so it lies between them."},
{q:"Sahil wrote '6 Thousand, 0 Hundreds, 5 Tens, 3 Ones' as 653. Is this correct? What is the correct number?", opts:["6053","653","6530","6503"], correct:0, exp:"6 Thousand + 0 Hundreds + 5 Tens + 3 Ones = 6000 + 50 + 3 = 6053, so Sahil's answer was wrong."},
{q:"There are 99 numbers strictly between 400 and 500. How many numbers are strictly between 4000 and 5000?", opts:["999","900","1000","899"], correct:0, exp:"Between any two consecutive thousands (like 4000 and 5000), there are 999 numbers strictly in between (4001 to 4999)."},
{q:"Compare: 3 Tens + 5 Thousands + 2 Hundreds ___ 5230", opts:["=","&lt;","&gt;","Cannot be compared"], correct:0, exp:"3 Tens + 5 Thousands + 2 Hundreds = 5000 + 200 + 30 = 5230, which is equal to 5230."},
{q:"Compare: 2 Thousands + 8 Hundreds + 9 Tens + 9 Ones ___ 3000", opts:["&lt;","&gt;","=","Cannot be compared"], correct:0, exp:"2 Thousands + 8 Hundreds + 9 Tens + 9 Ones = 2899, which is less than 3000."},
{q:"Which is the correct increasing order of 4258, 2458, 8245 and 5824?", opts:["2458 &lt; 4258 &lt; 5824 &lt; 8245","8245 &lt; 5824 &lt; 4258 &lt; 2458","4258 &lt; 2458 &lt; 5824 &lt; 8245","2458 &lt; 5824 &lt; 4258 &lt; 8245"], correct:0, exp:"Comparing the thousands digit of each number gives the increasing order: 2458 &lt; 4258 &lt; 5824 &lt; 8245."},
{q:"Which is the correct decreasing order of heights 4506, 3982, 5210 and 2870?", opts:["5210 &gt; 4506 &gt; 3982 &gt; 2870","2870 &gt; 3982 &gt; 4506 &gt; 5210","4506 &gt; 5210 &gt; 3982 &gt; 2870","5210 &gt; 3982 &gt; 4506 &gt; 2870"], correct:0, exp:"Comparing the thousands digit first gives the decreasing order: 5210 &gt; 4506 &gt; 3982 &gt; 2870."},
{q:"Which is the smallest 4-digit number you can make using the digits 2, 5, 6 and 9 without repeating any digit?", opts:["2569","2596","9652","5269"], correct:0, exp:"To make the smallest number, place the digits in increasing order from left to right: 2569."},
{q:"Which is the largest 4-digit number you can make using the digits 3, 4, 7 and 1 without repeating any digit?", opts:["7431","1347","4731","7413"], correct:0, exp:"To make the largest number, place the digits in decreasing order from left to right: 7431."},
{q:"Which comparison is correct?", opts:["4098 &gt; 4089","4098 &lt; 4089","4098 = 4089","Cannot be compared"], correct:0, exp:"Comparing the tens digit: 4098 has 9 Tens while 4089 has 8 Tens, so 4098 &gt; 4089."},
{q:"How many Hundreds are there in 3600?", opts:["36","3","6","360"], correct:0, exp:"3600 has 36 complete hundreds (36 &times; 100 = 3600)."},
{q:"Which number is made by 1 Thousand, 5 Hundreds, 10 Tens and 17 Ones?", opts:["1617","1517","1607","1717"], correct:0, exp:"1000 + 500 + (10 &times; 10) + 17 = 1000 + 500 + 100 + 17 = 1617."},
{q:"Mark 760 on a number line. How much more to make 1000? 760 + ___ = 1000", opts:["240","260","230","250"], correct:0, exp:"1000 &minus; 760 = 240."},
{q:"Which number lies strictly between 2226 and 3226?", opts:["2236","3316","2216","3236"], correct:0, exp:"2236 is greater than 2226 and less than 3226, so it lies between them. The others are either below 2226 or above 3226."},
{q:"Which number is made by 12 Hundreds, 18 Tens and 2 Ones?", opts:["1382","1182","1372","1392"], correct:0, exp:"12 Hundreds = 1200; 18 Tens = 180; 1200 + 180 + 2 = 1382."},
{q:"Complete the addition fact: 618 + ___ = 1000", opts:["382","372","392","282"], correct:0, exp:"1000 &minus; 618 = 382."}
];

const form = document.getElementById('quiz');
questions.forEach((item,i)=>{
  const card = document.createElement('div');
  card.className='q-card';
  let optsHtml = item.opts.map((opt,j)=>`
    <label class="opt" data-q="${i}" data-o="${j}">
      <input type="radio" name="q${i}" value="${j}">
      <span>${String.fromCharCode(65+j)}. ${opt}</span>
    </label>`).join('');
  card.innerHTML = `<div class="q-num">Question ${i+1}</div>
    <div class="q-text">${item.q}</div>
    <div class="opts">${optsHtml}</div>
    <div class="explain" id="exp${i}"></div>`;
  form.appendChild(card);
});

document.getElementById('submitBtn').addEventListener('click', ()=>{
  let score=0, unanswered=0;
  questions.forEach((item,i)=>{
    const selected = form.querySelector(`input[name="q${i}"]:checked`);
    const labels = form.querySelectorAll(`label[data-q="${i}"]`);
    const expDiv = document.getElementById(`exp${i}`);
    labels.forEach(l=>{
      const o = parseInt(l.dataset.o);
      l.querySelector('input').disabled = true;
      if(o===item.correct) l.classList.add('correct');
      if(selected && parseInt(selected.value)===o && o!==item.correct) l.classList.add('wrong');
    });
    if(selected && parseInt(selected.value)===item.correct) score++;
    if(!selected) unanswered++;
    expDiv.classList.add('show');
    expDiv.innerHTML = `<b>Explanation:</b> ${item.exp}`;
  });
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('result').innerHTML = `
    <div class="score-card">
      <h2>Score: ${score} / ${questions.length}</h2>
      <div>${unanswered>0 ? unanswered+' question(s) left unanswered' : 'All questions answered — great job!'}</div>
    </div>`;
  document.getElementById('result').scrollIntoView({behavior:'smooth'});
});
</script>
</body>
</html>
