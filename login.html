<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math ma'am Academy — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/theme.css">
<link rel="stylesheet" href="./assets/css/login.css">
</head>
<body>

  <div class="login-card">
    <div class="login-logo">
      <img src="./assets/img/logoHB.png" alt="Math ma'am Academy">
    </div>
    <h1>Student Login</h1>
    <p class="sub">Enter your name and the shared access code to reach the practice test portal.</p>

    <div class="login-error" id="login-error">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
      <span>That access code isn't right. Please check with your teacher and try again.</span>
    </div>

    <form id="login-form" autocomplete="off">
      <div class="field">
        <label for="username">Your Name</label>
        <input type="text" id="username" name="username" placeholder="e.g. Aaditya Bhosale" required>
      </div>
      <div class="field">
        <label for="password">Access Code</label>
        <input type="password" id="password" name="password" placeholder="Shared access code" required>
      </div>
      <button type="submit" class="login-btn">
        Enter Portal
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 5l7 7-7 7"/></svg>
      </button>
    </form>

    <p class="login-note">This portal is only for students of Math ma'am Academy. Ask your teacher if you don't have the access code.</p>
  </div>

  <script>
    const ACCESS_CODES = ["Tree@bamboo", "Stone@rock", "Water@river", "Fire@flame", "Air@wind", "Earth@soil", "Light@sun", "Darkness@night", "Ocean@wave", "Mountain@peak"];

    // If already logged in, skip straight to the portal.
    if (localStorage.getItem('mm_auth') === '1') {
      window.location.href = './index.html';
    }

    document.getElementById('login-form').addEventListener('submit', function(e){
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('login-error');

      if (ACCESS_CODES.includes(password) && username.length > 0) {
        localStorage.setItem('mm_auth', '1');
        localStorage.setItem('mm_user', username);
        window.location.href = './index.html';
      } else {
        errorBox.classList.add('show');
      }
    });
  </script>

</body>
</html>
